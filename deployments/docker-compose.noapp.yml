services:
  postgres:
    image: postgres:17-alpine
    container_name: bokdy-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-bokdy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bokdy}
      POSTGRES_DB: ${DB_NAME:-bokdy}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - bokdy_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bokdy}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: bokdy-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bokdy_pg_data:
