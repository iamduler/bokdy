openapi: 3.1.0
info:
  title: Bokdy API
  version: 0.1.0
  description: |
    Bokdy foundation API (Identity + Organization).
    Locale is taken from Accept-Language (missing → vi). Read models return a resolved name;
    owner edit payloads use name_en + name_vi.
    Auth: send X-Client (player|owner|admin) on register, login, refresh, logout.
    Timestamps are UTC RFC3339. Rate limit: 429 TOO_MANY_REQUESTS.
    Error envelope: { code, message, details? }. Codes are UPPERCASE; see packages/config/error-codes.json.
servers:
  - url: http://localhost:8088
    description: Local
tags:
  - name: Health
  - name: Auth
  - name: Identity
  - name: Organizations
  - name: Branches
  - name: Admin
paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness
      responses:
        "200":
          description: OK
  /ready:
    get:
      tags: [Health]
      summary: Readiness
      responses:
        "200":
          description: Ready
        "503":
          description: Not ready
  /metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics (unauthenticated)
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [html, prometheus, prom, text, openmetrics]
          description: Force HTML browse view or Prometheus text. Browsers default to HTML via Accept.
      responses:
        "200":
          description: Prometheus text for scrapers. Browsers (Accept text/html) get a grouped HTML view.
          content:
            text/plain:
              schema:
                type: string
            application/openmetrics-text:
              schema:
                type: string
            text/html:
              schema:
                type: string
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register user
      parameters:
        - $ref: "#/components/parameters/XClient"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Created
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login
      parameters:
        - $ref: "#/components/parameters/XClient"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponseEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh tokens
      parameters:
        - $ref: "#/components/parameters/XClient"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/auth/verify:
    post:
      tags: [Auth]
      summary: Verify email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
      responses:
        "204":
          description: Verified
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/auth/password/forgot:
    post:
      tags: [Auth]
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordForgotRequest"
      responses:
        "204":
          description: Accepted
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/auth/password/reset:
    post:
      tags: [Auth]
      summary: Confirm password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "204":
          description: Reset
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XClient"
      responses:
        "204":
          description: Logged out
  /api/v1/identity/me:
    get:
      tags: [Identity]
      summary: Current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Identity]
      summary: Update own profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/MeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/organizations:
    get:
      tags: [Organizations]
      summary: List my organizations
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Organization"
    post:
      tags: [Organizations]
      summary: Create organization
      description: Creates tenant, organization, default business unit (`code=default`), and owner staff with `org_owner`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/organizations/{id}:
    get:
      tags: [Organizations]
      summary: Get organization
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/XOrganizationIdOptional"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Organizations]
      summary: Update organization
      description: Owner or system admin. Does not change status.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/XOrganizationIdOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/organizations/{id}/staff:
    get:
      tags: [Organizations]
      summary: List staff
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/XOrganizationIdOptional"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/StaffMember"
    post:
      tags: [Organizations]
      summary: Add staff directly
      description: Owner only. Body uses existing `user_id`. Default role `org_staff`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/XOrganizationIdOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddStaffRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/StaffMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/organizations/{id}/staff/{staffId}:
    patch:
      tags: [Organizations]
      summary: Update staff
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/StaffId"
        - $ref: "#/components/parameters/XOrganizationIdOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStaffRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/StaffMember"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Organizations]
      summary: Remove staff
      description: Sets status resigned and revokes tenant roles. Cannot remove last owner.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/StaffId"
        - $ref: "#/components/parameters/XOrganizationIdOptional"
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/organizations/{id}/staff/{staffId}/suspend:
    post:
      tags: [Organizations]
      summary: Suspend staff
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/StaffId"
        - $ref: "#/components/parameters/XOrganizationIdOptional"
      responses:
        "204":
          description: Suspended
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/organizations/{id}/staff/{staffId}/restore:
    post:
      tags: [Organizations]
      summary: Restore staff
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/StaffId"
        - $ref: "#/components/parameters/XOrganizationIdOptional"
      responses:
        "204":
          description: Restored
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/organizations/{id}/staff/{staffId}/roles:
    post:
      tags: [Organizations]
      summary: Assign seeded role
      description: Seed roles only (`org_owner`, `org_staff`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/StaffId"
        - $ref: "#/components/parameters/XOrganizationIdOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRoleRequest"
      responses:
        "204":
          description: Assigned
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/organizations/{id}/staff/{staffId}/roles/{roleId}:
    delete:
      tags: [Organizations]
      summary: Remove role
      description: Cannot remove last `org_owner`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/StaffId"
        - name: roleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XOrganizationIdOptional"
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/organizations/{id}/invitations:
    post:
      tags: [Organizations]
      summary: Invite staff
      description: Owner only. Invitee must not already be an active/suspended member.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/XOrganizationIdOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/organizations/{id}/invitations/{invitationId}/revoke:
    post:
      tags: [Organizations]
      summary: Revoke invitation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XOrganizationIdOptional"
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/organizations/invitations/accept:
    post:
      tags: [Organizations]
      summary: Accept invitation
      description: JWT email must match invitation email.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
      responses:
        "204":
          description: Accepted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/organizations/invitations/reject:
    post:
      tags: [Organizations]
      summary: Reject invitation
      description: JWT email must match invitation email. Sets status `rejected` (not revoked).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
      responses:
        "204":
          description: Rejected
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/branches:
    get:
      tags: [Branches]
      summary: List branches
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganizationId"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Branch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [Branches]
      summary: Create branch
      description: Owner only. Initial status `inactive`. Creates empty location_settings (no scheduling rows).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganizationId"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBranchRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Branch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/branches/{id}:
    get:
      tags: [Branches]
      summary: Get branch
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - $ref: "#/components/parameters/XOrganizationId"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Branch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Branches]
      summary: Update branch
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - $ref: "#/components/parameters/XOrganizationId"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBranchRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Branch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/branches/{id}/open:
    post:
      tags: [Branches]
      summary: Open branch
      description: "inactive -> active"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - $ref: "#/components/parameters/XOrganizationId"
      responses:
        "204":
          description: Opened
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/branches/{id}/close:
    post:
      tags: [Branches]
      summary: Close branch
      description: "active -> inactive"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - $ref: "#/components/parameters/XOrganizationId"
      responses:
        "204":
          description: Closed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/branches/{id}/archive:
    post:
      tags: [Branches]
      summary: Archive branch
      description: "Any non-archived status -> archived. Booking checks deferred until Booking exists."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - $ref: "#/components/parameters/XOrganizationId"
      responses:
        "204":
          description: Archived
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/admin/health:
    get:
      tags: [Admin]
      summary: Admin health (system admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
        "403":
          description: Forbidden
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrganizationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StaffId:
      name: staffId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BranchId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    XOrganizationId:
      name: X-Organization-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Tenant organization context. Required for `/api/v1/branches*`.
    XOrganizationIdOptional:
      name: X-Organization-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: If present on nested `/organizations/{id}/...` routes, must match path id.
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        default: vi
        example: vi
      description: BCP-47. First supported tag (vi, en) wins. Missing or unknown → vi.
    TraceID:
      name: X-Trace-ID
      in: header
      required: false
      schema:
        type: string
        example: 0af7651916cd43dd8448eb211c80319c
      description: 32-char hex OpenTelemetry trace id (Loki join key). Echoed on the response. Prefer traceparent; if only this header is sent (UUID or hex), Go synthesizes a traceparent.
    Traceparent:
      name: traceparent
      in: header
      required: false
      schema:
        type: string
        example: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
      description: W3C Trace Context. Propagated BFF → API → Asynq. Echoed on the response when a span is active.
    XClient:
      name: X-Client
      in: header
      required: true
      schema:
        type: string
        enum: [player, owner, admin]
      description: Audience BFF. Required on register, login, refresh, logout. Missing → 400. Admin register forbidden. Admin login requires is_system_admin.
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Malformed JSON body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: BAD_REQUEST
            message: invalid json body
    ValidationFailed:
      description: Field validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: VALIDATION
            message: invalid request
            details:
              - field: email
                code: REQUIRED
                message: email is required
  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - VALIDATION
            - BAD_REQUEST
            - TOO_MANY_REQUESTS
            - INTERNAL
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string }
        code:
          type: string
          enum:
            - REQUIRED
            - EMAIL_INVALID
            - TOO_SHORT
            - TOO_LONG
            - UUID_INVALID
            - ONE_OF
            - INVALID
            - PASSWORD_POLICY
        message: { type: string }
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password:
          type: string
          minLength: 8
          description: At least 8 characters; must include uppercase, lowercase, a number, and a special character.
        full_name: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        phone: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    VerifyRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    PasswordForgotRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    PasswordResetRequest:
      type: object
      required: [token, new_password]
      properties:
        token: { type: string }
        new_password:
          type: string
          minLength: 8
          description: At least 8 characters; must include uppercase, lowercase, a number, and a special character.
    Organization:
      type: object
      required: [id, public_id, tenant_id, code, name, status]
      properties:
        id: { type: string, format: uuid }
        public_id: { type: string, minLength: 26, maxLength: 26 }
        tenant_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string, description: Resolved from Accept-Language }
        name_en: { type: string }
        name_vi: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        status: { type: string }
    CreateOrganizationRequest:
      type: object
      description: At least one of name, name_en, or name_vi is required.
      properties:
        name: { type: string, description: Alias for name_vi when name_vi is omitted }
        name_en: { type: string }
        name_vi: { type: string }
        code: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
    UpdateOrganizationRequest:
      type: object
      properties:
        name_en: { type: string }
        name_vi: { type: string }
        code: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
    StaffMember:
      type: object
      required: [id, user_id, status, roles]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        title: { type: string }
        location_id: { type: string, format: uuid }
        status: { type: string, enum: [invited, active, suspended, resigned] }
        roles:
          type: array
          items: { type: string }
    AddStaffRequest:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string, format: uuid }
        title: { type: string }
        role_code: { type: string, enum: [org_owner, org_staff], default: org_staff }
    UpdateStaffRequest:
      type: object
      properties:
        title: { type: string }
        location_id: { type: string, format: uuid }
    AssignRoleRequest:
      type: object
      required: [role_code]
      properties:
        role_code: { type: string, enum: [org_owner, org_staff] }
    InviteRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        role_code: { type: string, enum: [org_owner, org_staff], default: org_staff }
    Invitation:
      type: object
      required: [id, email, role_code, token, expires_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role_code: { type: string }
        token: { type: string }
        expires_at: { type: string, format: date-time }
    AcceptInviteRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    BranchAddress:
      type: object
      properties:
        country_id: { type: string, format: uuid }
        state: { type: string }
        city: { type: string }
        district: { type: string }
        ward: { type: string }
        address_line_1: { type: string }
        address_line_2: { type: string }
        postal_code: { type: string }
    Branch:
      type: object
      required: [id, public_id, organization_id, code, name, status]
      properties:
        id: { type: string, format: uuid }
        public_id: { type: string, minLength: 26, maxLength: 26 }
        organization_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string, description: Resolved from Accept-Language }
        name_en: { type: string }
        name_vi: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        timezone: { type: string }
        status: { type: string, enum: [active, inactive, maintenance, archived] }
        address:
          $ref: "#/components/schemas/BranchAddress"
    CreateBranchRequest:
      type: object
      description: At least one of name_en or name_vi is required. Initial status is inactive.
      properties:
        name_en: { type: string }
        name_vi: { type: string }
        code: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        timezone: { type: string }
        address:
          $ref: "#/components/schemas/BranchAddress"
    UpdateBranchRequest:
      type: object
      properties:
        name_en: { type: string }
        name_vi: { type: string }
        code: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        timezone: { type: string }
        address:
          $ref: "#/components/schemas/BranchAddress"
    User:
      type: object
      required: [id, public_id, status, is_system_admin]
      properties:
        id: { type: string, format: uuid }
        public_id: { type: string, minLength: 26, maxLength: 26 }
        email: { type: string, format: email }
        full_name: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        display_name: { type: string }
        phone: { type: string }
        status: { type: string }
        is_system_admin: { type: boolean }
        email_verified_at: { type: string, format: date-time, description: UTC }
        phone_verified_at: { type: string, format: date-time, description: UTC }
        locale_id: { type: string, format: uuid }
        timezone: { type: string }
        country_id: { type: string, format: uuid }
        preferred_currency_code: { type: string }
        theme: { type: string, enum: [light, dark, system] }
        date_format: { type: string, enum: [dmy, mdy, ymd] }
        roles:
          type: array
          items: { type: string }
    UpdateProfileRequest:
      type: object
      properties:
        first_name: { type: string }
        last_name: { type: string }
        full_name: { type: string }
        display_name: { type: string }
        phone: { type: string }
        locale_id: { type: string, format: uuid }
        timezone: { type: string }
        country_id: { type: string, format: uuid }
        preferred_currency_code: { type: string }
        theme: { type: string, enum: [light, dark, system] }
        date_format: { type: string, enum: [dmy, mdy, ymd] }
    MeResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
    TokenResponseEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            access_token: { type: string }
            refresh_token: { type: string }
            expires_at: { type: string, format: date-time }
            token_type: { type: string }
            user:
              $ref: "#/components/schemas/User"
