      tags: [Payments]
      summary: Create payment
      description: |
        Creates a payment intent against an `issued` invoice. Amount is always the invoice total.
        One `pending` or `succeeded` intent per invoice; retry returns the existing intent.
        Staff `method=cash` creates and completes in one request. Player `method=mock` stays pending
        until `/complete` or `/fail`. PSP webhooks are reserved for a later wave.
        Emits PaymentCreated; cash also emits PaymentSucceeded, InvoicePaid, and BookingConfirmed when the booking was pending.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganizationIdOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "200":
          description: Existing open payment returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "201":
          description: Payment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/payments/{id}/complete:
    post:
      tags: [Payments]
      summary: Complete payment (mock)
      description: |
        Mock complete for a pending intent (player own or staff). Marks the invoice paid and confirms
        a pending booking. Already-succeeded is idempotent. Real PSP webhook is reserved.
        Emits PaymentSucceeded, InvoicePaid, and BookingConfirmed when the booking was pending.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PaymentId"
        - $ref: "#/components/parameters/XOrganizationIdOptional"
      responses:
        "200":
          description: Payment completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/payments/{id}/fail:
    post:
      tags: [Payments]
      summary: Fail payment (mock)
      description: Mock fail for a pending intent (player own or staff). Emits PaymentFailed. Real PSP webhook is reserved.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PaymentId"
        - $ref: "#/components/parameters/XOrganizationIdOptional"
      responses:
        "200":
          description: Payment failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/payments/{id}/refund:
    post:
      tags: [Payments]
      summary: Refund payment (owner)
      description: |
        Full-amount mock refund. Inserts a refund row; the original intent stays succeeded and the
        invoice stays paid with `refunded_amount` updated. Does not cancel the booking. Emits PaymentRefunded.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PaymentId"
        - $ref: "#/components/parameters/XOrganizationId"
      responses:
        "200":
          description: Refund completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRefund"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/admin/health:
    get:
      tags: [Admin]
      summary: Admin health (system admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, scope]
                properties:
                  status: { type: string, example: ok }
                  scope: { type: string, example: admin }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/admin/organizations:
    get:
      tags: [Admin]
      summary: List all organizations
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Filter by code or name
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive, suspended, archived]
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: province_id
          in: query
          schema: { type: string, format: uuid }
          description: Filter orgs with at least one branch in this province (current_v2 address)
      responses:
        "200":
          description: Organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminOrganization"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/admin/organizations/{id}:
    get:
      tags: [Admin]
      summary: Get organization
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrganization"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/admin/organizations/{id}/activate:
    post:
      tags: [Admin]
      summary: Activate organization
      description: |
        UC-ORG-003 workaround (no subscription): tenant `trial` → `active`, org `inactive` → `active`.
        Does not unsuspend. Already active is idempotent and does not emit a duplicate event.
        Emits OrganizationActivated when status changes.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Organization activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrganization"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/admin/organizations/{id}/suspend:
    post:
      tags: [Admin]
      summary: Suspend organization
      description: |
        Org `active` → `suspended` and tenant `trial|active` → `suspended`. Reason is required
        and stored on OrganizationSuspended only. Marketplace hides the org; staff membership
        routes and new holds/payments are rejected.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendOrganizationRequest"
      responses:
        "200":
          description: Organization suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrganization"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/admin/organizations/{id}/restore:
    post:
      tags: [Admin]
      summary: Restore organization
      description: Suspended org and tenant → `active`. Emits OrganizationRestored.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Organization restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrganization"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrganizationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StaffId:
      name: staffId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BranchId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CustomerId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CourtTypeId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CourtId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PriceVersionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReservationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BookingId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvoiceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AvailabilityFrom:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date-time
      description: Inclusive range start (UTC RFC3339)
    AvailabilityTo:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date-time
      description: Exclusive range end (UTC RFC3339)
    XOrganizationId:
      name: X-Organization-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Tenant organization context. Required for `/api/v1/branches*`, staff `/api/v1/customers*`, `/api/v1/court-types*`, `/api/v1/courts*`, staff schedule/availability routes, and staff booking routes (list, walk-in, confirm, check-in, complete).
    XOrganizationIdOptional:
      name: X-Organization-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: If present on nested `/organizations/{id}/...` routes, must match path id.
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        default: vi
        example: vi
      description: BCP-47. First supported tag (vi, en) wins. Missing or unknown → vi.
    TraceID:
      name: X-Trace-ID
      in: header
      required: false
      schema:
        type: string
        example: 0af7651916cd43dd8448eb211c80319c
      description: 32-char hex OpenTelemetry trace id (Loki join key). Echoed on the response. Prefer traceparent; if only this header is sent (UUID or hex), Go synthesizes a traceparent.
    Traceparent:
      name: traceparent
      in: header
      required: false
      schema:
        type: string
        example: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
      description: W3C Trace Context. Propagated BFF → API → Asynq. Echoed on the response when a span is active.
    XClient:
      name: X-Client
      in: header
      required: true
      schema:
        type: string
        enum: [player, owner, admin]
      description: Audience BFF. Required on register, login, refresh, logout. Missing → 400. Admin register forbidden. Admin login requires is_system_admin.
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Malformed JSON body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: BAD_REQUEST
            message: invalid json body
    ValidationFailed:
      description: Field validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: VALIDATION
            message: invalid request
            details:
              - field: email
                code: REQUIRED
                message: email is required
  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - VALIDATION
            - BAD_REQUEST
            - TOO_MANY_REQUESTS
            - INTERNAL
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string }
        code:
          type: string
          enum:
            - REQUIRED
            - EMAIL_INVALID
            - TOO_SHORT
            - TOO_LONG
            - UUID_INVALID
            - ONE_OF
            - INVALID
            - PASSWORD_POLICY
        message: { type: string }
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password:
          type: string
          minLength: 8
          description: At least 8 characters; must include uppercase, lowercase, a number, and a special character.
        full_name: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        phone: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    VerifyRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    PasswordForgotRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    PasswordResetRequest:
      type: object
      required: [token, new_password]
      properties:
        token: { type: string }
        new_password:
          type: string
          minLength: 8
          description: At least 8 characters; must include uppercase, lowercase, a number, and a special character.
    Organization:
      type: object
      required: [id, public_id, tenant_id, code, name, status]
      properties:
        id: { type: string, format: uuid }
        public_id: { type: string, minLength: 26, maxLength: 26 }
        tenant_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string, description: Resolved from Accept-Language }
        name_en: { type: string }
        name_vi: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        status: { type: string, enum: [active, inactive, suspended, archived] }
        tenant_status: { type: string, enum: [trial, active, suspended, canceled], description: Present on admin organization reads }
    AdminOrganization:
      allOf:
        - $ref: "#/components/schemas/Organization"
        - type: object
          required: [tenant_status, branch_count]
          properties:
            tenant_status: { type: string, enum: [trial, active, suspended, canceled] }
            branch_count: { type: integer, minimum: 0, description: Non-archived branch (location) count }
    SuspendOrganizationRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }
    CreateOrganizationRequest:
      type: object
      description: At least one of name, name_en, or name_vi is required.
      properties:
        name: { type: string, description: Alias for name_vi when name_vi is omitted }
        name_en: { type: string }
        name_vi: { type: string }
        code: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
    UpdateOrganizationRequest:
      type: object
      properties:
        name_en: { type: string }
        name_vi: { type: string }
        code: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
    StaffMember:
      type: object
      required: [id, user_id, status, roles]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        title: { type: string }
        location_id: { type: string, format: uuid }
        status: { type: string, enum: [invited, active, suspended, resigned] }
        roles:
          type: array
          items: { type: string }
    AddStaffRequest:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string, format: uuid }
        title: { type: string }
        role_code: { type: string, enum: [org_owner, org_staff], default: org_staff }
    UpdateStaffRequest:
      type: object
      properties:
        title: { type: string }
        location_id: { type: string, format: uuid }
    AssignRoleRequest:
      type: object
      required: [role_code]
      properties:
        role_code: { type: string, enum: [org_owner, org_staff] }
    InviteRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        role_code: { type: string, enum: [org_owner, org_staff], default: org_staff }
    Invitation:
      type: object
      required: [id, email, role_code, token, expires_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role_code: { type: string }
        token: { type: string }
        expires_at: { type: string, format: date-time }
    AcceptInviteRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    BranchAddress:
      type: object
      required: [division_scheme]
      properties:
        division_scheme:
          $ref: "#/components/schemas/AdminDivisionScheme"
        country_id: { type: string, format: uuid }
        province_former_id: { type: string, format: uuid }
        district_former_id: { type: string, format: uuid }
        ward_former_id: { type: string, format: uuid }
        province_id: { type: string, format: uuid }
        ward_id: { type: string, format: uuid }
        address_line_1: { type: string }
        address_line_2: { type: string }
    AdminDivisionScheme:
      type: string
      enum: [former_v3, current_v2]
    AdminUnit:
      type: object
      required: [id, code, name, name_en, name_vi]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string, description: Resolved from Accept-Language }
        name_en: { type: string }
        name_vi: { type: string }
    Branch:
      type: object
      required: [id, public_id, organization_id, code, name, status]
      properties:
        id: { type: string, format: uuid }
        public_id: { type: string, minLength: 26, maxLength: 26 }
        organization_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string, description: Resolved from Accept-Language }
        name_en: { type: string }
        name_vi: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        timezone: { type: string }
        status: { type: string, enum: [active, inactive, maintenance, archived] }
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/BranchAddress"
    CreateBranchRequest:
      type: object
      description: At least one of name_en or name_vi is required. Initial status is inactive.
      properties:
        name_en: { type: string }
        name_vi: { type: string }
        code: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        timezone: { type: string }
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/BranchAddress"
    UpdateBranchRequest:
      type: object
      properties:
        name_en: { type: string }
        name_vi: { type: string }
        code: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        timezone: { type: string }
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/BranchAddress"
    CustomerContact:
      type: object
      required: [type, value, is_primary, is_verified]
      properties:
        type: { type: string, enum: [email, phone] }
        value: { type: string }
        label: { type: string }
        is_primary: { type: boolean }
        is_verified: { type: boolean }
    Customer:
      type: object
      required: [id, public_id, code, customer_type, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        public_id: { type: string, minLength: 26, maxLength: 26 }
        code: { type: string }
        customer_type: { type: string, enum: [individual, organization] }
        status: { type: string, enum: [lead, active, inactive, blacklisted, deleted] }
        user_id: { type: string, format: uuid }
        full_name: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        source: { type: string }
        organization_name: { type: string }
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/CustomerContact"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateGuestCustomerRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string }
        full_name: { type: string }
        email: { type: string, format: email }
        code: { type: string, description: Optional; auto-generated when omitted }
        source: { type: string }
    RegisterCustomerMeRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string }
        full_name: { type: string }
        email: { type: string, format: email }
        code: { type: string }
    UpdateCustomerRequest:
      type: object
      properties:
        full_name: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        code: { type: string }
        source: { type: string }
    BlacklistCustomerRequest:
      type: object
      properties:
        reason: { type: string }
    CourtType:
      type: object
      required: [id, code, name, status, slot_duration_minutes]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string, description: Resolved from Accept-Language }
        name_en: { type: string }
        name_vi: { type: string }
        status: { type: string, enum: [active, archived] }
        slot_duration_minutes: { type: integer }
    CreateCourtTypeRequest:
      type: object
      required: [slot_duration_minutes]
      description: At least one of name_en or name_vi is required. slot_duration_minutes 15–180, multiple of 15.
      properties:
        name_en: { type: string }
        name_vi: { type: string }
        code: { type: string, description: Optional; auto-generated when omitted }
        slot_duration_minutes: { type: integer, minimum: 15, maximum: 180 }
    UpdateCourtTypeRequest:
      type: object
      properties:
        name_en: { type: string }
        name_vi: { type: string }
        code: { type: string }
        slot_duration_minutes: { type: integer, minimum: 15, maximum: 180 }
    Court:
      type: object
      required: [id, public_id, branch_id, court_type_id, code, name, status, is_bookable]
      properties:
        id: { type: string, format: uuid }
        public_id: { type: string, minLength: 26, maxLength: 26 }
        branch_id: { type: string, format: uuid }
        court_type_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string, description: Resolved from Accept-Language }
        name_en: { type: string }
        name_vi: { type: string }
        status: { type: string, enum: [active, inactive, maintenance, archived] }
        is_bookable: { type: boolean }
    CreateCourtRequest:
      type: object
      required: [branch_id, court_type_id]
      description: At least one of name_en or name_vi is required. Initial status is inactive.
      properties:
        branch_id: { type: string, format: uuid }
        court_type_id: { type: string, format: uuid }
        name_en: { type: string }
        name_vi: { type: string }
        code: { type: string }
    UpdateCourtRequest:
      type: object
      properties:
        name_en: { type: string }
        name_vi: { type: string }
        code: { type: string, description: Immutable; sending a different value is rejected }
        court_type_id: { type: string, format: uuid }
    ScheduleMaintenanceRequest:
      type: object
      properties:
        title: { type: string }
        reason: { type: string }
        started_at: { type: string, format: date-time }
    BusinessHour:
      type: object
      required: [weekday, is_closed]
      properties:
        weekday: { type: integer, minimum: 0, maximum: 6, description: "0=Sunday … 6=Saturday" }
        opens_at: { type: string, example: "08:00", description: Required when is_closed=false }
        closes_at: { type: string, example: "22:00", description: Required when is_closed=false }
        is_closed: { type: boolean }
    PutWeeklyScheduleRequest:
      type: object
      required: [days]
      properties:
        days:
          type: array
          minItems: 7
          maxItems: 7
          items:
            $ref: "#/components/schemas/BusinessHour"
    CreateSpecialScheduleRequest:
      type: object
      required: [starts_at, ends_at]
      properties:
        name_en: { type: string }
        name_vi: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        is_closed: { type: boolean, default: true }
        opens_at: { type: string, example: "10:00" }
        closes_at: { type: string, example: "14:00" }
    SpecialSchedule:
      type: object
      required: [id, name, starts_at, ends_at, is_closed]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        name_en: { type: string }
        name_vi: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        is_closed: { type: boolean }
        opens_at: { type: string }
        closes_at: { type: string }
    CreateBlockRequest:
      type: object
      required: [starts_at, ends_at]
      properties:
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        reason: { type: string }
    ResourceBlock:
      type: object
