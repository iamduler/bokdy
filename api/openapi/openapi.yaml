openapi: 3.1.0
info:
  title: Bokdy API
  version: 0.1.0
  description: Bokdy foundation API (Identity + Organization)
servers:
  - url: http://localhost:8088
    description: Local
tags:
  - name: Health
  - name: Auth
  - name: Identity
  - name: Organizations
  - name: Admin
paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness
      responses:
        "200":
          description: OK
  /ready:
    get:
      tags: [Health]
      summary: Readiness
      responses:
        "200":
          description: Ready
        "503":
          description: Not ready
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Created
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponseEnvelope"
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: OK
  /api/v1/auth/verify:
    post:
      tags: [Auth]
      summary: Verify email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
      responses:
        "204":
          description: Verified
  /api/v1/auth/password/forgot:
    post:
      tags: [Auth]
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordForgotRequest"
      responses:
        "204":
          description: Accepted
  /api/v1/auth/password/reset:
    post:
      tags: [Auth]
      summary: Confirm password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "204":
          description: Reset
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Logged out
  /api/v1/identity/me:
    get:
      tags: [Identity]
      summary: Current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/MeResponse"
  /api/v1/organizations:
    get:
      tags: [Organizations]
      summary: List my organizations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Organization"
    post:
      tags: [Organizations]
      summary: Create organization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Organization"
  /api/v1/organizations/{id}/staff:
    get:
      tags: [Organizations]
      summary: List staff
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: OK
  /api/v1/organizations/{id}/invitations:
    post:
      tags: [Organizations]
      summary: Invite staff
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
      responses:
        "201":
          description: Created
  /api/v1/organizations/invitations/accept:
    post:
      tags: [Organizations]
      summary: Accept invitation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
      responses:
        "204":
          description: Accepted
  /api/v1/admin/health:
    get:
      tags: [Admin]
      summary: Admin health (system admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
        "403":
          description: Forbidden
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrganizationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        full_name: { type: string }
        first_name: { type: string }
        last_name: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    VerifyRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    PasswordForgotRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    PasswordResetRequest:
      type: object
      required: [token, new_password]
      properties:
        token: { type: string }
        new_password: { type: string, minLength: 8 }
    Organization:
      type: object
      required: [id, public_id, tenant_id, code, name, status]
      properties:
        id: { type: string, format: uuid }
        public_id: { type: string, minLength: 26, maxLength: 26 }
        tenant_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        status: { type: string }
    CreateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        code: { type: string }
        email: { type: string, format: email }
    InviteRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        role_code: { type: string }
    AcceptInviteRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    User:
      type: object
      required: [id, public_id, status, is_system_admin]
      properties:
        id: { type: string, format: uuid }
        public_id: { type: string, minLength: 26, maxLength: 26 }
        email: { type: string, format: email }
        full_name: { type: string }
        status: { type: string }
        is_system_admin: { type: boolean }
        roles:
          type: array
          items: { type: string }
    MeResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
    TokenResponseEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            access_token: { type: string }
            refresh_token: { type: string }
            expires_at: { type: string, format: date-time }
            token_type: { type: string }
            user:
              $ref: "#/components/schemas/User"
