openapi: 3.1.0
info:
  title: Bokdy API
  version: 0.1.0
  description: |
    Bokdy foundation API (Identity + Organization + CRM + Catalog + Scheduling + Pricing
    + Reservation + Booking + Billing + Payment).
    Locale is taken from Accept-Language (missing → vi). Read models return a resolved name;
    owner edit payloads use name_en + name_vi.
    Auth: send X-Client (player|owner|admin) on register, login, refresh, logout.
    Timestamps are UTC RFC3339. Rate limit: 429 TOO_MANY_REQUESTS.
    Error envelope: { code, message, details? }. Codes are UPPERCASE; see packages/config/error-codes.json.
servers:
  - url: http://localhost:8088
    description: Local
tags:
  - name: Health
  - name: Auth
  - name: Identity
  - name: Organizations
  - name: Branches
  - name: Customers
  - name: CourtTypes
  - name: Courts
  - name: Schedule
  - name: Marketplace
  - name: Reference
  - name: Pricing
  - name: Reservations
  - name: Bookings
  - name: Invoices
  - name: Payments
  - name: Admin
paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness
      responses:
        "200":
          description: OK
  /ready:
    get:
      tags: [Health]
      summary: Readiness
      responses:
        "200":
          description: Ready
        "503":
          description: Not ready
  /metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics (unauthenticated)
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [html, prometheus, prom, text, openmetrics]
          description: Force HTML browse view or Prometheus text. Browsers default to HTML via Accept.
      responses:
        "200":
          description: Prometheus text for scrapers. Browsers (Accept text/html) get a grouped HTML view.
          content:
            text/plain:
              schema:
                type: string
            application/openmetrics-text:
              schema:
                type: string
            text/html:
              schema:
                type: string
  /api/v1/reference/locales:
    get:
      tags: [Reference]
      summary: List active locales
      description: |
        Public catalog of active UI locales from `reference.locales`
        (code, English name, native endonym, flag emoji). Used by locale switchers.
      responses:
        "200":
          description: Active locales (default first, then code)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Locale"
  /api/v1/reference/admin-units/provinces:
    get:
      tags: [Reference]
      summary: List provinces or cities (VN)
      description: |
        Public catalog of Vietnamese provinces/cities. Use `former_v3` for the pre-merger
        63-province catalog or `current_v2` for the post-merger 34-province catalog.
      parameters:
        - name: scheme
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/AdminDivisionScheme"
      responses:
        "200":
          description: Provinces
          headers:
            Cache-Control:
              schema: { type: string }
              description: public, max-age=86400
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminUnit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/reference/admin-units/districts:
    get:
      tags: [Reference]
      summary: List districts (former_v3 only)
      parameters:
        - name: province_id
          in: query
          required: true
          schema: { type: string, format: uuid }
          description: UUID from `former_v3` province list
      responses:
        "200":
          description: Districts
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminUnit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/reference/admin-units/wards:
    get:
      tags: [Reference]
      summary: List or search wards
      parameters:
        - name: scheme
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/AdminDivisionScheme"
        - name: province_id
          in: query
          schema: { type: string, format: uuid }
          description: Required when scheme is `current_v2`
        - name: district_id
          in: query
          schema: { type: string, format: uuid }
          description: Required when scheme is `former_v3`
        - name: q
          in: query
          schema: { type: string, minLength: 2 }
          description: Optional search (max 50 results)
      responses:
        "200":
          description: Wards
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminUnit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register user
      parameters:
        - $ref: "#/components/parameters/XClient"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Created
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login
      parameters:
        - $ref: "#/components/parameters/XClient"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponseEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh tokens
      parameters:
        - $ref: "#/components/parameters/XClient"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/auth/verify:
    post:
      tags: [Auth]
      summary: Verify email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
      responses:
        "204":
          description: Verified
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/auth/password/forgot:
    post:
      tags: [Auth]
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordForgotRequest"
      responses:
        "204":
          description: Accepted
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/auth/password/reset:
    post:
      tags: [Auth]
      summary: Confirm password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "204":
          description: Reset
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XClient"
      responses:
        "204":
          description: Logged out
  /api/v1/identity/me:
    get:
      tags: [Identity]
      summary: Current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Identity]
      summary: Update own profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/MeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/identity/sessions:
    get:
      tags: [Identity]
      summary: List current user sessions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/identity/sessions/revoke-all:
    post:
      tags: [Identity]
      summary: Revoke all current user sessions
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Error"
  /api/v1/identity/sessions/{id}:
    delete:
      tags: [Identity]
      summary: Revoke one current user session
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/organizations:
    get:
      tags: [Organizations]
      summary: List my organizations
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Organization"
    post:
      tags: [Organizations]
      summary: Create organization
      description: Creates tenant, organization, default business unit (`code=default`), and owner staff with `org_owner`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/organizations/{id}:
    get:
      tags: [Organizations]
      summary: Get organization
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/XOrganizationIdOptional"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [Organizations]
      summary: Update organization
      description: Owner or system admin. Does not change status.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/XOrganizationIdOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/organizations/{id}/staff:
    get:
      tags: [Organizations]
      summary: List staff
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/XOrganizationIdOptional"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/StaffMember"
    post:
      tags: [Organizations]
      summary: Add staff directly
      description: Owner only. Body uses existing `user_id`. Default role `org_staff`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/XOrganizationIdOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddStaffRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/StaffMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/organizations/{id}/staff/{staffId}:
    patch:
      tags: [Organizations]
      summary: Update staff
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/StaffId"
        - $ref: "#/components/parameters/XOrganizationIdOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStaffRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/StaffMember"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Organizations]
      summary: Remove staff
      description: Sets status resigned and revokes tenant roles. Cannot remove last owner.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/StaffId"
        - $ref: "#/components/parameters/XOrganizationIdOptional"
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/organizations/{id}/staff/{staffId}/suspend:
    post:
      tags: [Organizations]
      summary: Suspend staff
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/StaffId"
        - $ref: "#/components/parameters/XOrganizationIdOptional"
      responses:
        "204":
          description: Suspended
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/organizations/{id}/staff/{staffId}/restore:
    post:
      tags: [Organizations]
      summary: Restore staff
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/StaffId"
        - $ref: "#/components/parameters/XOrganizationIdOptional"
      responses:
        "204":
          description: Restored
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/organizations/{id}/staff/{staffId}/roles:
    post:
      tags: [Organizations]
      summary: Assign seeded role
      description: Seed roles only (`org_owner`, `org_staff`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/StaffId"
        - $ref: "#/components/parameters/XOrganizationIdOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRoleRequest"
      responses:
        "204":
          description: Assigned
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/organizations/{id}/staff/{staffId}/roles/{roleId}:
    delete:
      tags: [Organizations]
      summary: Remove role
      description: Cannot remove last `org_owner`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/StaffId"
        - name: roleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XOrganizationIdOptional"
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/organizations/{id}/invitations:
    post:
      tags: [Organizations]
      summary: Invite staff
      description: Owner only. Invitee must not already be an active/suspended member.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/XOrganizationIdOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/organizations/{id}/invitations/{invitationId}/revoke:
    post:
      tags: [Organizations]
      summary: Revoke invitation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XOrganizationIdOptional"
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /api/v1/organizations/invitations/accept:
    post:
      tags: [Organizations]
      summary: Accept invitation
      description: JWT email must match invitation email.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
      responses:
        "204":
          description: Accepted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/organizations/invitations/reject:
    post:
      tags: [Organizations]
      summary: Reject invitation
      description: JWT email must match invitation email. Sets status `rejected` (not revoked).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
      responses:
        "204":
          description: Rejected
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/branches:
    get:
      tags: [Branches]
      summary: List branches
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganizationId"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Branch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [Branches]
      summary: Create branch
      description: Owner only. Initial status `inactive`. Creates empty location_settings (no scheduling rows).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XOrganizationId"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBranchRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Branch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
  /api/v1/branches/{id}:
    get:
      tags: [Branches]
      summary: Get branch
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - $ref: "#/components/parameters/XOrganizationId"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Branch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Error"
        "403":
