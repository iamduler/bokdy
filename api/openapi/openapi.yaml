      schema:
        type: string
        format: uuid
    CourtTypeId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CourtId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AvailabilityFrom:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date-time
      description: Inclusive range start (UTC RFC3339)
    AvailabilityTo:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date-time
      description: Exclusive range end (UTC RFC3339)
    XOrganizationId:
      name: X-Organization-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Tenant organization context. Required for `/api/v1/branches*`, staff `/api/v1/customers*`, `/api/v1/court-types*`, `/api/v1/courts*`, and staff schedule/availability routes.
    XOrganizationIdOptional:
      name: X-Organization-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: If present on nested `/organizations/{id}/...` routes, must match path id.
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        default: vi
        example: vi
      description: BCP-47. First supported tag (vi, en) wins. Missing or unknown → vi.
    TraceID:
      name: X-Trace-ID
      in: header
      required: false
      schema:
        type: string
        example: 0af7651916cd43dd8448eb211c80319c
      description: 32-char hex OpenTelemetry trace id (Loki join key). Echoed on the response. Prefer traceparent; if only this header is sent (UUID or hex), Go synthesizes a traceparent.
    Traceparent:
      name: traceparent
      in: header
      required: false
      schema:
        type: string
        example: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
      description: W3C Trace Context. Propagated BFF → API → Asynq. Echoed on the response when a span is active.
    XClient:
      name: X-Client
      in: header
      required: true
      schema:
        type: string
        enum: [player, owner, admin]
      description: Audience BFF. Required on register, login, refresh, logout. Missing → 400. Admin register forbidden. Admin login requires is_system_admin.
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Malformed JSON body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: BAD_REQUEST
            message: invalid json body
    ValidationFailed:
      description: Field validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: VALIDATION
            message: invalid request
            details:
              - field: email
                code: REQUIRED
                message: email is required
  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - VALIDATION
            - BAD_REQUEST
            - TOO_MANY_REQUESTS
            - INTERNAL
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string }
        code:
          type: string
          enum:
            - REQUIRED
            - EMAIL_INVALID
            - TOO_SHORT
            - TOO_LONG
            - UUID_INVALID
            - ONE_OF
            - INVALID
            - PASSWORD_POLICY
        message: { type: string }
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password:
          type: string
          minLength: 8
          description: At least 8 characters; must include uppercase, lowercase, a number, and a special character.
        full_name: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        phone: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    VerifyRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    PasswordForgotRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    PasswordResetRequest:
      type: object
      required: [token, new_password]
      properties:
        token: { type: string }
        new_password:
          type: string
          minLength: 8
          description: At least 8 characters; must include uppercase, lowercase, a number, and a special character.
    Organization:
      type: object
      required: [id, public_id, tenant_id, code, name, status]
      properties:
        id: { type: string, format: uuid }
        public_id: { type: string, minLength: 26, maxLength: 26 }
        tenant_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string, description: Resolved from Accept-Language }
        name_en: { type: string }
        name_vi: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        status: { type: string }
    CreateOrganizationRequest:
      type: object
      description: At least one of name, name_en, or name_vi is required.
      properties:
        name: { type: string, description: Alias for name_vi when name_vi is omitted }
        name_en: { type: string }
        name_vi: { type: string }
        code: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
    UpdateOrganizationRequest:
      type: object
      properties:
        name_en: { type: string }
        name_vi: { type: string }
        code: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
    StaffMember:
