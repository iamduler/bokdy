version: "2"
sql:
  - engine: "postgresql"
    queries:
      - "internal/platform/persistence/queries/*.sql"
      - "internal/platform/persistence/queries/identity/*.sql"
      - "internal/platform/persistence/queries/organization/*.sql"
      - "internal/platform/persistence/queries/crm/*.sql"
      - "internal/platform/persistence/queries/catalog/*.sql"
      - "internal/platform/persistence/queries/scheduling/*.sql"
      - "internal/platform/persistence/queries/pricing/*.sql"
    schema: "db/schema.sql"
    gen:
      go:
        package: "dbsqlc"
        out: "db/generated/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "inet"
            go_type: "string"
          - db_type: "inet"
            nullable: true
            go_type:
              type: "string"
              pointer: true
